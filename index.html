<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voas - Word Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --primary: #ffffff;
            --secondary: #a1a1aa;
            --accent: #3b82f6;
            --error: #ef4444;
            --success: #22c55e;
            --font: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: var(--font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            position: relative;
        }

        /* Screens */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Typography */
        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--secondary);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        /* Buttons */
        .btn {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid #333;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            max-width: 300px;
            margin-bottom: 1rem;
            font-family: var(--font);
        }

        .btn:hover {
            background: #2a2a2a;
            border-color: #555;
            transform: translateY(-2px);
        }

        .btn.super-hard {
            border-color: var(--error);
            color: var(--error);
        }

        .btn.super-hard:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Game Header */
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 2rem;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .hearts {
            color: var(--error);
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        /* Play Area */
        .play-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .syllable-box {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: var(--accent);
            transition: color 0.3s;
        }

        .timer-bar {
            width: 100%;
            height: 6px;
            background: var(--surface);
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: var(--primary);
            width: 100%;
            transition: width 0.1s linear, background-color 0.3s;
        }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--surface);
            color: var(--primary);
            font-size: 2rem;
            text-align: center;
            padding: 0.5rem;
            font-family: var(--font);
            outline: none;
            transition: border-color 0.3s;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-bottom-color: var(--accent);
        }

        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            height: 20px;
            color: var(--secondary);
            font-weight: 600;
        }

        .used-words {
            margin-top: auto;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: var(--secondary);
            max-height: 60px;
            overflow-y: auto;
        }

        /* Loading */
        .loader {
            border: 3px solid var(--surface);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Loading Screen -->
        <div id="loading-screen" class="screen active">
            <div class="loader"></div>
            <h2>Loading Dictionary...</h2>
            <p>Fetching all English words</p>
        </div>

        <!-- Menu Screen -->
        <div id="menu-screen" class="screen">
            <h1>VOAS</h1>
            <p>Type a word containing the 3 letters.</p>

            <div class="tabs" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <button onclick="setMode('normal')" id="tab-normal" style="padding: 0.5rem 1.5rem; background: var(--surface); color: var(--primary); border: 1px solid var(--accent); border-radius: 8px; cursor: pointer; font-family: var(--font); font-weight: 600; transition: all 0.2s;">NORMAL</button>
                <button onclick="setMode('impossible')" id="tab-impossible" style="padding: 0.5rem 1.5rem; background: transparent; color: var(--secondary); border: 1px solid #333; border-radius: 8px; cursor: pointer; font-family: var(--font); font-weight: 600; transition: all 0.2s;">IMPOSSIBLE</button>
            </div>

            <div id="modes-normal" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <button class="btn" onclick="startGame('easy', false)">Easy (Stupid Bot)</button>
                <button class="btn" onclick="startGame('medium', false)">Medium (Kinda Smart)</button>
                <button class="btn" onclick="startGame('hard', false)">Hard (Smarter Bot)</button>
                <button class="btn super-hard" onclick="startGame('super_hard', false)">SUPER HARD</button>
            </div>

            <div id="modes-impossible" style="width: 100%; display: none; flex-direction: column; align-items: center;">
                <button class="btn super-hard" onclick="startGame('easy', true)">Easy (Stupid Bot)</button>
                <button class="btn super-hard" onclick="startGame('medium', true)">Medium (Kinda Smart)</button>
                <button class="btn super-hard" onclick="startGame('hard', true)">Hard (Smarter Bot)</button>
            </div>

            <div style="margin-top: 2rem; padding: 1rem; background: var(--surface); border-radius: 8px; border: 1px solid #333; width: 100%; max-width: 300px; text-align: left;">
                <h3 style="font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--accent);">What's New:</h3>
                <ul style="font-size: 0.8rem; color: var(--secondary); margin-left: 1.2rem; line-height: 1.5;">
                    <li>Bug fixes</li>
                    <li>IMPOSSIBLE mode added</li>
                    <li>Bot difficulty adjusted</li>
                </ul>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="header">
                <div class="player-info">
                    <div class="name">YOU</div>
                    <div class="hearts" id="player-hp">♥♥♥</div>
                </div>
                <div class="player-info">
                    <div class="name" id="bot-name">BOT</div>
                    <div class="hearts" id="bot-hp">♥♥♥</div>
                </div>
            </div>

            <div class="timer-bar">
                <div class="timer-fill" id="timer-fill"></div>
            </div>

            <div class="play-area">
                <div class="syllable-box" id="syllable-display">EXT</div>
                <input type="text" id="word-input" autocomplete="off" spellcheck="false" placeholder="TYPE HERE...">
                <div class="status" id="status-msg">Your turn!</div>
            </div>

            <div class="used-words" id="used-words-display"></div>
        </div>

        <!-- Game Over Screen -->
        <div id="result-screen" class="screen">
            <h1 id="result-title">YOU WON!</h1>
            <p id="result-desc">The bot ran out of words.</p>
            <button class="btn" onclick="showMenu()">Play Again</button>
        </div>
    </div>

    <script>
        let dictionary = [];
        let usedWords = new Set();
        let currentSyllable = "";
        let turn = "player";
        let hp = { player: 3, bot: 3 };
        let difficulty = "medium";

        let timeLeft = 10;
        let maxTime = 10;
        let timerInterval;
        let botTypingTimeout;

        const screens = {
            loading: document.getElementById('loading-screen'),
            menu: document.getElementById('menu-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const ui = {
            playerHp: document.getElementById('player-hp'),
            botHp: document.getElementById('bot-hp'),
            botName: document.getElementById('bot-name'),
            syllable: document.getElementById('syllable-display'),
            input: document.getElementById('word-input'),
            timerFill: document.getElementById('timer-fill'),
            status: document.getElementById('status-msg'),
            usedWords: document.getElementById('used-words-display'),
            resultTitle: document.getElementById('result-title'),
            resultDesc: document.getElementById('result-desc')
        };

        function animateSoftBlurIn(element, text) {
            if (!element) return;
            element.innerHTML = '';
            const chars = text.split('');
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.innerText = char === ' ' ? '\u00A0' : char;
                span.style.display = 'inline-block';
                span.style.opacity = '0';
                span.style.filter = 'blur(12px)';
                span.style.transform = 'translateY(16px)';
                element.appendChild(span);

                span.animate([
                    { opacity: 0, filter: 'blur(12px)', transform: 'translateY(16px)' },
                    { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0)' }
                ], {
                    duration: 900,
                    delay: index * 25,
                    easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                    fill: 'forwards'
                });
            });
        }

        function animatePerCharacterRise(element, text) {
            if (!element) return;
            element.innerHTML = '';
            const chars = text.split('');
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.innerText = char === ' ' ? '\u00A0' : char;
                span.style.display = 'inline-block';
                span.style.opacity = '0';
                span.style.transform = 'translateY(20px)';
                element.appendChild(span);

                span.animate([
                    { opacity: 0, transform: 'translateY(20px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ], {
                    duration: 600,
                    delay: index * 30,
                    easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                    fill: 'forwards'
                });
            });
        }

        async function loadDictionary() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_dictionary.json');
                const data = await response.json();
                dictionary = Object.keys(data).filter(word => word.length >= 3);
                switchScreen('menu');
            } catch (error) {
                alert("Failed to load dictionary. Please check your internet connection and refresh.");
            }
        }

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');

            if (screenName === 'menu') {
                const title = document.querySelector('#menu-screen h1');
                if (title) animateSoftBlurIn(title, 'VOAS');
            } else if (screenName === 'result') {
                animateSoftBlurIn(ui.resultTitle, ui.resultTitle.innerText);
            }
        }

        function showMenu() {
            switchScreen('menu');
        }

        function setMode(mode) {
            const tabNormal = document.getElementById('tab-normal');
            const tabImpossible = document.getElementById('tab-impossible');
            const modesNormal = document.getElementById('modes-normal');
            const modesImpossible = document.getElementById('modes-impossible');

            if (mode === 'normal') {
                tabNormal.style.background = 'var(--surface)';
                tabNormal.style.color = 'var(--primary)';
                tabNormal.style.borderColor = 'var(--accent)';
                
                tabImpossible.style.background = 'transparent';
                tabImpossible.style.color = 'var(--secondary)';
                tabImpossible.style.borderColor = '#333';

                modesNormal.style.display = 'flex';
                modesImpossible.style.display = 'none';
            } else {
                tabImpossible.style.background = 'var(--surface)';
                tabImpossible.style.color = 'var(--error)';
                tabImpossible.style.borderColor = 'var(--error)';
                
                tabNormal.style.background = 'transparent';
                tabNormal.style.color = 'var(--secondary)';
                tabNormal.style.borderColor = '#333';

                modesNormal.style.display = 'none';
                modesImpossible.style.display = 'flex';
            }
        }

        function startGame(diff, isImpossible) {
            difficulty = diff;
            const maxHp = isImpossible ? 1 : 3;
            maxTime = isImpossible ? 5 : 10;
            hp = { player: maxHp, bot: maxHp };
            usedWords.clear();
            updateHP();
            ui.usedWords.innerHTML = "Used words: None";

            const botNames = { easy: "BOT (EASY)", medium: "BOT (MEDIUM)", hard: "BOT (HARD)", super_hard: "BOT (GOD)" };
            ui.botName.innerText = isImpossible ? `BOT (${diff.toUpperCase()} - IMP)` : botNames[diff];

            switchScreen('game');
            nextRound('player');
        }

        function getHearts(count) {
            return '♥'.repeat(Math.max(0, count));
        }

        function updateHP() {
            ui.playerHp.innerText = getHearts(hp.player);
            ui.botHp.innerText = getHearts(hp.bot);

            if (hp.player <= 0) endGame(false);
            else if (hp.bot <= 0) endGame(true);
        }

        function generateSyllable() {
            let valid = false;
            let syllable = "";
            while (!valid) {
                const randomWord = dictionary[Math.floor(Math.random() * dictionary.length)];
                if (randomWord.length >= 4) {
                    const startIndex = Math.floor(Math.random() * (randomWord.length - 2));
                    syllable = randomWord.substring(startIndex, startIndex + 3);
                    if (/^[a-z]{3}$/.test(syllable)) valid = true;
                }
            }
            return syllable.toUpperCase();
        }

        function nextRound(startingTurn) {
            turn = startingTurn;
            currentSyllable = generateSyllable();
            animatePerCharacterRise(ui.syllable, currentSyllable);
            ui.input.value = "";
            startTurn();
        }

        function startTurn() {
            clearInterval(timerInterval);
            clearTimeout(botTypingTimeout);
            timeLeft = maxTime;
            ui.timerFill.style.width = "100%";
            ui.timerFill.style.backgroundColor = "var(--primary)";
            ui.syllable.style.color = "var(--accent)";
            ui.input.style.borderBottomColor = "var(--surface)";

            if (turn === 'player') {
                ui.input.disabled = false;
                ui.input.focus();
                ui.status.innerText = "Your turn! Type a word.";
                ui.status.style.color = "var(--primary)";
            } else {
                ui.input.disabled = true;
                ui.status.innerText = "Bot is thinking...";
                ui.status.style.color = "var(--secondary)";
                triggerBotPlay();
            }

            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                const percentage = (timeLeft / maxTime) * 100;
                ui.timerFill.style.width = `${percentage}%`;

                if (timeLeft <= 3) {
                    ui.timerFill.style.backgroundColor = "var(--error)";
                    ui.syllable.style.color = "var(--error)";
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    failTurn("Time's up!");
                }
            }, 100);
        }

        function failTurn(reason) {
            clearTimeout(botTypingTimeout);
            if (turn === 'player') {
                hp.player--;
                ui.status.innerText = `You lost a heart! (${reason})`;
                ui.status.style.color = "var(--error)";
            } else {
                hp.bot--;
                ui.status.innerText = `Bot lost a heart! (${reason})`;
                ui.status.style.color = "var(--success)";
            }
            updateHP();

            if (hp.player > 0 && hp.bot > 0) {
                setTimeout(() => nextRound(turn === 'player' ? 'bot' : 'player'), 1500);
            }
        }

        ui.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && turn === 'player') {
                const word = ui.input.value.trim().toLowerCase();
                validateWord(word);
            }
        });

        function validateWord(word) {
            if (word.length < 3) {
                showError("Word too short!");
                return;
            }
            if (!word.includes(currentSyllable.toLowerCase())) {
                showError(`Must contain "${currentSyllable}"!`);
                return;
            }
            if (usedWords.has(word)) {
                showError("Word already used!");
                return;
            }
            if (!dictionary.includes(word)) {
                showError("Not in dictionary!");
                return;
            }

            acceptWord(word);
        }

        function showError(msg) {
            ui.status.innerText = msg;
            ui.status.style.color = "var(--error)";
            ui.input.style.borderBottomColor = "var(--error)";
            setTimeout(() => {
                if (timeLeft > 0) {
                    ui.status.innerText = "Your turn! Type a word.";
                    ui.status.style.color = "var(--primary)";
                    ui.input.style.borderBottomColor = "var(--surface)";
                }
            }, 1500);
        }

        function acceptWord(word) {
            clearInterval(timerInterval);
            usedWords.add(word);
            updateUsedWordsUI();

            ui.status.innerText = "Correct!";
            ui.status.style.color = "var(--success)";
            ui.syllable.style.color = "var(--success)";

            setTimeout(() => {
                turn = turn === 'player' ? 'bot' : 'player';
                currentSyllable = generateSyllable();
                animatePerCharacterRise(ui.syllable, currentSyllable);
                ui.input.value = "";
                startTurn();
            }, 800);
        }

        function updateUsedWordsUI() {
            const wordsArray = Array.from(usedWords);
            const recentWords = wordsArray.slice(-10);
            ui.usedWords.innerText = `Used words: ${recentWords.join(', ')}${wordsArray.length > 10 ? '...' : ''}`;
        }

        function triggerBotPlay() {
            // Lấy danh sách TẤT CẢ các từ hợp lệ trong từ điển
            const possibleWords = dictionary.filter(w =>
                w.includes(currentSyllable.toLowerCase()) && !usedWords.has(w)
            );

            let thinkingTime = 0;
            let willFail = false;
            let chosenWord = "";

            if (possibleWords.length === 0) {
                willFail = true;
                thinkingTime = 3000;
            } else {
                // LỌC TỪ: Ưu tiên chọn những từ có độ dài từ 4 đến 8 chữ cái để giống con người
                let humanLikeWords = possibleWords.filter(w => w.length >= 4 && w.length <= 8);

                // Nếu có từ phù hợp chuẩn "con người" thì dùng, nếu không thì lấy ngẫu nhiên từ bất kỳ
                let poolToChoose = humanLikeWords.length > 0 ? humanLikeWords : possibleWords;

                // Chọc ngẫu nhiên 1 từ thay vì chọn từ dài nhất
                chosenWord = poolToChoose[Math.floor(Math.random() * poolToChoose.length)];

                if (difficulty === 'easy') {
                    thinkingTime = Math.random() * 5000 + 4000;
                    willFail = Math.random() < 0.3;
                } else if (difficulty === 'medium') {
                    thinkingTime = Math.random() * 3000 + 2000;
                    willFail = Math.random() < 0.1;
                } else if (difficulty === 'hard') {
                    thinkingTime = Math.random() * 1800 + 1200;
                    willFail = Math.random() < 0.12;
                } else { // SUPER HARD
                    thinkingTime = Math.random() * 1200 + 500;
                    willFail = Math.random() < 0.05;
                }
            }

            botTypingTimeout = setTimeout(() => {
                if (timeLeft <= 0) return;

                if (willFail) {
                    const wrongWords = dictionary.filter(w => !w.includes(currentSyllable.toLowerCase()));
                    const wrongWord = wrongWords[Math.floor(Math.random() * wrongWords.length)];
                    ui.input.value = wrongWord.toUpperCase();
                    setTimeout(() => {
                        ui.status.innerText = "Bot typed a wrong word!";
                        ui.status.style.color = "var(--error)";
                        ui.input.style.borderBottomColor = "var(--error)";
                        clearInterval(timerInterval);
                        setTimeout(() => failTurn("Wrong word!"), 1500);
                    }, 300);
                } else {
                    ui.input.value = chosenWord.toUpperCase();
                    setTimeout(() => {
                        acceptWord(chosenWord);
                    }, 300);
                }
            }, thinkingTime);
        }

        function endGame(playerWon) {
            clearInterval(timerInterval);
            clearTimeout(botTypingTimeout);

            if (playerWon) {
                ui.resultTitle.innerText = "YOU WON!";
                ui.resultTitle.style.color = "var(--success)";
                ui.resultDesc.innerText = "You defeated the bot.";
            } else {
                ui.resultTitle.innerText = "YOU LOST!";
                ui.resultTitle.style.color = "var(--error)";
                ui.resultDesc.innerText = "The bot outsmarted you.";
            }

            setTimeout(() => switchScreen('result'), 1000);
        }

        window.onload = loadDictionary;

    </script>

    <div style="position: fixed; bottom: 12px; left: 16px; font-size: 0.8rem; color: var(--secondary); pointer-events: none;">
        Credit: Made by hvu 🩷
    </div>
    <div style="position: fixed; bottom: 12px; right: 16px; font-size: 0.8rem; color: var(--secondary); pointer-events: none;">
        Version: 2.0
    </div>

</body>
